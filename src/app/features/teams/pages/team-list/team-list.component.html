<div class="page-content">
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
    <div><h1 class="page-title">Equipos</h1><p class="page-subtitle">{{ teams.length }} equipos registrados</p></div>
    <button mat-flat-button color="primary" routerLink="new"><mat-icon>group_add</mat-icon> Agregar equipo</button>
  </div>
  <app-loading-spinner *ngIf="loading" />
  <mat-card *ngIf="!loading">
    <div style="overflow-x:auto">
      <table mat-table [dataSource]="teams" style="width:100%">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let t" style="font-weight:500;color:#E2E8F5">{{ t.name }}</td>
        </ng-container>
        <ng-container matColumnDef="tournamentId">
          <th mat-header-cell *matHeaderCellDef>Torneo ID</th>
          <td mat-cell *matCellDef="let t" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:#8C97B4">{{ t.tournamentId }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="text-align:right">Acciones</th>
          <td mat-cell *matCellDef="let t" style="text-align:right">
            <button mat-icon-button [routerLink]="[t.id, 'edit']" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
            <button mat-icon-button color="warn" matTooltip="Eliminar"><mat-icon>delete_outline</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
    <app-empty-state *ngIf="!loading && teams.length === 0" icon="groups" title="Sin equipos" subtitle="Agregá equipos al torneo" />
  </mat-card>
</div>
