<div class="page-content">
  <div class="page-header" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:24px">
    <div><h1 class="page-title">Equipos</h1><p class="page-subtitle">{{ teams.length }} equipos registrados</p></div>
    <button mat-flat-button color="primary" routerLink="new"><mat-icon>group_add</mat-icon> Agregar equipo</button>
  </div>
  <app-loading-spinner *ngIf="loading" />

  <mat-card *ngIf="!loading && groupedTeams.length === 0">
    <app-empty-state icon="groups" title="Sin equipos" subtitle="Agregá equipos al torneo" />
  </mat-card>

  <section class="tournament-section" *ngFor="let group of groupedTeams">
    <mat-card>
      <button
        type="button"
        class="tournament-header"
        (click)="toggleTournament(group.tournamentId)"
      >
        <span class="tournament-name">{{ group.tournamentName }}</span>
        <span class="tournament-meta">{{ group.teams.length }} equipos</span>
        <mat-icon class="tournament-chevron" [class.rotated]="!isTournamentCollapsed(group.tournamentId)">
          expand_more
        </mat-icon>
      </button>

      <div class="tournament-body" [class.collapsed]="isTournamentCollapsed(group.tournamentId)">
        <div class="tournament-body-inner" style="overflow-x:auto">
          <table mat-table [dataSource]="group.teams" style="width:100%">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Nombre</th>
              <td mat-cell *matCellDef="let t" class="team-name-cell">{{ t.name }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef style="text-align:right">Acciones</th>
              <td mat-cell *matCellDef="let t" style="text-align:right">
                <button mat-icon-button [routerLink]="[t.id, 'edit']" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
                <button mat-icon-button color="warn" matTooltip="Eliminar"><mat-icon>delete_outline</mat-icon></button>
              </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns; trackBy: trackById"></tr>
          </table>
        </div>
      </div>
    </mat-card>
  </section>
</div>
