<div class="page-content">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:24px">
    <button mat-icon-button routerLink="/app/teams"><mat-icon>arrow_back</mat-icon></button>
    <h1 class="page-title">{{ isEditMode ? 'Editar Equipo' : 'Nuevo Equipo' }}</h1>
  </div>
  <mat-card style="max-width:480px">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" style="width:100%;margin-bottom:8px">
          <mat-label>Nombre del equipo</mat-label>
          <input matInput formControlName="name" placeholder="Ej: Real Fútbol FC">
          <mat-error *ngIf="name?.hasError('required')">El nombre es obligatorio</mat-error>
        </mat-form-field>
        <mat-form-field appearance="outline" style="width:100%;margin-bottom:8px">
          <mat-label>Torneo</mat-label>
          <mat-select formControlName="tournamentId" [disabled]="tournamentsLoading">
            <mat-option *ngIf="tournamentsLoading" [value]="null" disabled>Cargando torneos...</mat-option>
            <mat-option *ngIf="!tournamentsLoading && tournaments.length === 0" [value]="null" disabled>
              No tienes torneos disponibles
            </mat-option>
            <mat-option *ngFor="let tournament of tournaments" [value]="tournament.id">
              {{ tournament.name }}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="tournamentId?.hasError('required')">Debes seleccionar un torneo</mat-error>
        </mat-form-field>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">
          <button mat-stroked-button type="button" routerLink="/app/teams">Cancelar</button>
          <button mat-flat-button color="primary" type="submit" [disabled]="loading || tournamentsLoading">
            <mat-icon>save</mat-icon> {{ isEditMode ? 'Actualizar' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
