<div class="page-content">
  <div class="page-header">
    <div>
      <h1 class="page-title">Partidos</h1>
      <p class="page-subtitle">{{ totalMatches }} partidos</p>
    </div>
  </div>

  <app-loading-spinner *ngIf="loading" />

  <mat-card *ngIf="!loading">
    <app-empty-state
      *ngIf="phaseGroups.length === 0"
      icon="sports_soccer"
      title="Sin partidos"
      subtitle="Los partidos se generan desde los fixtures del torneo"
    />

    <section class="phase-section" *ngFor="let phase of phaseGroups">
      <button
        type="button"
        class="phase-header"
        (click)="togglePhase(phase.phaseId)"
      >
        <span class="phase-title">{{ phase.phaseName }}</span>
        <span class="phase-meta">{{ phase.totalMatches }} partidos</span>
        <mat-icon class="phase-chevron" [class.rotated]="!isPhaseCollapsed(phase.phaseId)">
          expand_more
        </mat-icon>
      </button>

      <div class="phase-body" [class.collapsed]="isPhaseCollapsed(phase.phaseId)">
        <div class="phase-body-inner">
          <div class="day-block" *ngFor="let day of phase.days">
            <div class="day-header">
              <span>Fecha {{ day.matchday }}</span>
              <span>{{ day.totalMatches }} partidos</span>
            </div>

            <div class="match-row" *ngFor="let m of day.matches">
              <span class="matchday-label">J{{ m.matchday }}</span>
              <span class="team-name team-home">{{ m.homeTeamName || m.homeTeamId }}</span>
              <span class="match-score">
                {{ m.isPlayed ? (m.homeTeamScore + ' - ' + m.awayTeamScore) : '-' }}
              </span>
              <span class="team-name">{{ m.awayTeamName || m.awayTeamId }}</span>
              <app-status-badge [status]="m.isPlayed ? 'played' : 'pending'" />
              <button mat-stroked-button *ngIf="!m.isPlayed" [routerLink]="[m.id, 'result']" class="register-btn">
                Registrar
              </button>
            </div>
          </div>
        </div>
      </div>

    </section>
  </mat-card>
</div>
